[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zfactory"
version = "0.1.0"
description = "Software factory, app/website factories, content studio and research tooling in one monorepo."
requires-python = ">=3.11"
dependencies = ["pytest>=8"]  # software factory runs tests on generated code

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[project.scripts]
zf = "zfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zfactory = ["**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
