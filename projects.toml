# Registry of every factory, project and venture. Read by `zf projects` and `zf handoff check`.
# Codes follow the Google Drive Factory HQ: F# = factory, P## = project (Master Tracker). ZL/V## are repo-only.
# priority: 1 = highest (F1 software first, then F2/F3 web + apps, then F4/F5, research and ventures).

