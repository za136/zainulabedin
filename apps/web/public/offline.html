<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline</title>
<style>
  body{font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfaf7;color:#14161f}
  main{max-width:28rem;padding:2rem;text-align:center}
  h1{font-family:Georgia,serif;font-size:1.8rem;margin:.5rem 0}
  button{margin-top:1.5rem;padding:.75rem 1.5rem;border:0;border-radius:.75rem;background:#1d2b6b;color:#fff;font-weight:600;cursor:pointer}
  p{color:#5d6170}
</style>
</head>
<body>
<main>
  <div style="font-size:3rem">📡</div>
  <h1>Sie sind offline</h1>
  <p>Bitte prüfen Sie Ihre Internetverbindung. Ihr Warenkorb bleibt erhalten.</p>
  <p lang="en"><em>You are offline. Please check your connection — your cart is safe.</em></p>
  <button onclick="location.reload()">Erneut versuchen · Retry</button>
</main>
</body>
</html>
