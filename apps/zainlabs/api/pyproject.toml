[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zainlabs-api"
version = "0.1.0"
description = "ZAIN LABS backend: content API, leads, newsletter (double opt-in), admin."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[project.scripts]
zainlabs-api = "zainlabs_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
