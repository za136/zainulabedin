<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Mahn-Agent{% endblock %} · {{ company }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Mahn-Agent</a>
  <nav>
    <a href="/">Übersicht</a><a href="/freigaben">Freigaben</a><a href="/faelle">Rechnungen &amp; Fälle</a>
    <a href="/zahlungen">Zahlungen</a><a href="/audit">Protokoll</a><a href="/docs">API</a>
  </nav>
  <span class="mode">{{ llm_mode }} · ERP: {{ erp }}</span>
</header>
<main>
{% if msg %}<div class="flash ok">{{ msg }}</div>{% endif %}
{% if err %}<div class="flash err">{{ err }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
